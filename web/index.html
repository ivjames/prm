<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PRM</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-2: #172033;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --dim: #64748b;
        --green: #22c55e;
        --amber: #f59e0b;
        --red: #ef4444;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button, input, textarea { font: inherit; color: inherit; }
      a { color: var(--accent); }

      /* ---- centered auth card (signed-out) ---- */
      .center { min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; }
      .authwrap { width: min(28rem, 94vw); }
      h1 { margin: 0 0 0.25rem; font-size: 1.6rem; letter-spacing: -0.01em; }
      .tag { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.9rem; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
      label { display: block; font-size: 0.78rem; color: var(--muted); margin: 0.6rem 0 0.2rem; }
      input, textarea {
        width: 100%; padding: 0.55rem 0.7rem; border-radius: 8px;
        border: 1px solid var(--border); background: var(--bg);
      }
      input:focus, textarea:focus { outline: none; border-color: var(--accent); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
        width: 100%; margin-top: 0.9rem; padding: 0.6rem 0.9rem;
        border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none;
      }
      .btn-primary { background: var(--green); color: #06210f; }
      .btn-google { background: var(--text); color: var(--bg); }
      .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
      .btn-sm { width: auto; margin: 0; padding: 0.4rem 0.7rem; font-size: 0.85rem; font-weight: 600; }
      .sep { text-align: center; color: var(--dim); font-size: 0.8rem; margin: 0.9rem 0; }
      .msg { min-height: 1.1rem; margin-top: 0.5rem; font-size: 0.85rem; color: var(--red); }
      .hidden { display: none !important; }

      /* ---- app shell (signed-in) ---- */
      .app { display: flex; flex-direction: column; min-height: 100dvh; }
      .topbar {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); background: var(--panel-2);
        position: sticky; top: 0; z-index: 5;
      }
      .brand { font-weight: 700; letter-spacing: -0.01em; }
      .topbar .who { color: var(--muted); font-size: 0.85rem; margin-left: auto; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      @media (max-width: 560px) { .topbar .who { display: none; } #connect-google { margin-left: auto; } }
      .pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; padding: 0.2rem 0.55rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
      .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--dim); }
      .dot.ok { background: var(--green); } .dot.down { background: var(--red); }

      .cols { display: grid; grid-template-columns: minmax(18rem, 24rem) 1fr; flex: 1; min-height: 0; }
      @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } .detail-hidden-mobile { display: none; } }

      /* people list */
      .list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
      .list-tools { padding: 0.75rem; display: flex; gap: 0.5rem; align-items: center; border-bottom: 1px solid var(--border); }
      .list-tools input { flex: 1; }
      .people { overflow-y: auto; flex: 1; }
      .person {
        display: flex; align-items: center; gap: 0.6rem; width: 100%;
        padding: 0.7rem 0.85rem; border: 0; border-bottom: 1px solid var(--border);
        background: transparent; text-align: left; cursor: pointer;
      }
      .person:hover { background: var(--panel); }
      .person.active { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
      .avatar { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; background: #334155; color: #cbd5e1; flex: none; }
      .p-main { min-width: 0; flex: 1; }
      .p-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .p-sub { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .badge { font-size: 0.68rem; font-weight: 700; padding: 0.12rem 0.4rem; border-radius: 999px; flex: none; }
      .badge.overdue { background: rgba(239,68,68,0.15); color: #fca5a5; }
      .badge.due { background: rgba(245,158,11,0.15); color: #fcd34d; }
      .badge.ok { background: rgba(34,197,94,0.13); color: #86efac; }

      /* detail / timeline */
      .detail { overflow-y: auto; padding: 1.1rem 1.25rem; }
      .detail-top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
      #arch-btn { margin-left: auto; }
      #arch-toggle.active-toggle { background: var(--accent); color: var(--bg); border-color: var(--accent); }
      .detail h2 { margin: 0 0 0.2rem; font-size: 1.3rem; }
      .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.4rem 0 0.9rem; }
      .chip { font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.5rem; }
      .notes { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.1rem; white-space: pre-wrap; }
      .summary { padding: 0.7rem 0.8rem; margin: 0 0 0.9rem; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
      .sum-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
      .sum-head .btn-sm { margin: 0; }
      .sum-text { margin: 0.5rem 0 0; font-size: 0.92rem; }
      .sum-empty { margin: 0.5rem 0 0; font-size: 0.85rem; color: var(--dim); }
      .cadence { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; padding: 0.7rem 0.8rem; margin: 0 0 1.1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
      .cad-label { font-size: 0.85rem; font-weight: 600; }
      .cadence select { padding: 0.35rem 0.5rem; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); }
      .cadence select:focus { outline: none; border-color: var(--accent); }
      .cad-status { font-size: 0.8rem; color: var(--muted); }
      .cad-next { color: var(--muted); }
      .tl-head { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 0 0 0.5rem; }
      .tl { list-style: none; margin: 0; padding: 0; }
      .tl li { display: flex; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border); }
      .tl .icon { font-size: 1rem; width: 1.4rem; text-align: center; flex: none; }
      .tl .body { min-width: 0; flex: 1; }
      .tl .sum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tl .meta { font-size: 0.74rem; color: var(--muted); }
      .empty { color: var(--dim); padding: 2.5rem 1rem; text-align: center; }
      .backlink { display: none; }
      @media (max-width: 720px) { .backlink { display: inline-flex; margin-bottom: 0.75rem; } }

      /* modal */
      .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: grid; place-items: center; padding: 1.5rem; z-index: 20; }
      .modal { width: min(24rem, 94vw); }
      .row { display: flex; gap: 0.6rem; }
      .row .btn { margin-top: 1rem; }
    </style>
  </head>
  <body>
    <!-- ================= signed-out ================= -->
    <div id="auth-view" class="center hidden">
      <div class="authwrap">
        <h1>PRM</h1>
        <p class="tag">Personal relationship management.</p>
        <section class="card">
          <a class="btn btn-google" href="/api/auth/login/google">Sign in with Google</a>
          <div class="sep">— or —</div>
          <form id="pw-form">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required />
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required />
            <button class="btn btn-primary" type="submit">Sign in</button>
          </form>
          <div class="msg" id="signin-msg"></div>
        </section>
      </div>
    </div>

    <!-- ================= signed-in ================= -->
    <div id="app-view" class="app hidden">
      <div class="topbar">
        <span class="brand">PRM</span>
        <span class="pill" id="connect-pill"></span>
        <span class="who" id="who-email"></span>
        <a class="btn btn-ghost btn-sm" id="connect-google" href="/api/connect/google" title="Grant background read access to Gmail &amp; Calendar">Connect Google</a>
        <button class="btn btn-ghost btn-sm" id="signout">Sign out</button>
      </div>
      <div class="cols">
        <div class="list" id="list-col">
          <div class="list-tools">
            <input id="search" type="search" placeholder="Search contacts…" autocomplete="off" />
            <button class="btn btn-ghost btn-sm" id="arch-toggle" title="Show archived contacts">Archived</button>
            <button class="btn btn-primary btn-sm" id="add-btn">+ Add</button>
          </div>
          <div class="people" id="people"></div>
        </div>
        <div class="detail detail-hidden-mobile" id="detail">
          <div class="empty">Select a contact to see their timeline.</div>
        </div>
      </div>
    </div>

    <!-- ================= add-contact modal ================= -->
    <div id="modal" class="modal-bg hidden">
      <div class="card modal">
        <h1 style="font-size:1.1rem;margin-bottom:0.5rem">Add contact</h1>
        <form id="add-form">
          <label for="c-name">Name</label>
          <input id="c-name" type="text" required />
          <label for="c-tags">Tags <span style="color:var(--dim)">(comma-separated)</span></label>
          <input id="c-tags" type="text" placeholder="family, work" />
          <div class="row">
            <button type="button" class="btn btn-ghost" id="add-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Create</button>
          </div>
          <div class="msg" id="add-msg"></div>
        </form>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const show = (el, on) => el.classList.toggle("hidden", !on);
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]),
        );

      async function api(path, opts) {
        const r = await fetch(path, { credentials: "same-origin", ...opts });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j.error || `${r.status}`);
        }
        return r.json();
      }

      const state = { people: [], selectedId: null, filter: "", viewArchived: false };

      // ---- source / direction glyphs ----
      const SRC = { gmail: "✉️", gcal: "📅", graph: "✉️", manual: "✍️", voice: "🎙️" };
      const DIR = { in: "←", out: "→", mutual: "↔" };

      // cadence embed can arrive as [] / [{next_due}] / {next_due} / null
      function nextDue(p) {
        const c = p.next_due;
        const row = Array.isArray(c) ? c[0] : c;
        return row && row.next_due ? new Date(row.next_due) : null;
      }
      function dueBadge(p) {
        const due = nextDue(p);
        if (!due) return "";
        const days = (due - Date.now()) / 86400000;
        if (days < 0) return '<span class="badge overdue">overdue</span>';
        if (days < 3) return '<span class="badge due">soon</span>';
        return "";
      }
      const initials = (name) =>
        (name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]?.toUpperCase() || "").join("") || "?";
      const fmtDate = (iso) => {
        const d = new Date(iso);
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      };

      // ---- people list ----
      async function loadPeople() {
        try {
          const { people } = await api(`/api/people${state.viewArchived ? "?archived=1" : ""}`);
          state.people = people || [];
          renderPeople();
        } catch (e) {
          $("people").innerHTML = `<div class="empty">Couldn't load contacts: ${esc(e.message)}</div>`;
        }
      }
      function renderPeople() {
        const q = state.filter.trim().toLowerCase();
        const rows = state.people.filter((p) => !q || (p.name || "").toLowerCase().includes(q));
        if (rows.length === 0) {
          const emptyMsg = state.viewArchived
            ? "No archived contacts."
            : state.people.length === 0
              ? "No contacts yet. They appear automatically as email &amp; calendar activity is ingested — or add one manually."
              : "No matches.";
          $("people").innerHTML = `<div class="empty">${emptyMsg}</div>`;
          return;
        }
        $("people").innerHTML = rows
          .map((p) => {
            const tags = (p.tags || []).join(" · ");
            return `<button class="person ${p.id === state.selectedId ? "active" : ""}" data-id="${esc(p.id)}">
              <span class="avatar">${esc(initials(p.name))}</span>
              <span class="p-main">
                <span class="p-name">${esc(p.name)}</span>
                ${tags ? `<span class="p-sub">${esc(tags)}</span>` : ""}
              </span>
              ${dueBadge(p)}
            </button>`;
          })
          .join("");
      }

      // ---- person detail / timeline ----
      async function selectPerson(id) {
        state.selectedId = id;
        renderPeople();
        const detail = $("detail");
        detail.classList.remove("detail-hidden-mobile");
        detail.innerHTML = `<div class="empty">Loading…</div>`;
        try {
          const { person, timeline } = await api(`/api/people/${encodeURIComponent(id)}`);
          detail.innerHTML = renderDetail(person, timeline || []);
        } catch (e) {
          detail.innerHTML = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`;
        }
      }
      function renderDetail(person, timeline) {
        const tags = (person.tags || [])
          .map((t) => `<span class="chip">${esc(t)}</span>`)
          .join("");
        const items = timeline.length
          ? timeline
              .map(
                (i) => `<li>
                  <span class="icon" title="${esc(i.source)}">${SRC[i.source] || "•"}</span>
                  <span class="body">
                    <div class="sum">${esc(i.summary || "(no subject)")}</div>
                    <div class="meta">${esc(DIR[i.direction] || "")} ${esc(i.source)} · ${esc(fmtDate(i.occurred_at))}</div>
                  </span>
                </li>`,
              )
              .join("")
          : `<div class="empty">No interactions yet.</div>`;
        const archived = !!person.archived_at;
        return `
          <div class="detail-top">
            <button class="btn btn-ghost btn-sm backlink" id="back-btn">← Contacts</button>
            <button class="btn btn-ghost btn-sm" id="arch-btn" data-pid="${esc(person.id)}" data-archived="${archived ? 1 : 0}">${archived ? "Unarchive" : "Archive"}</button>
          </div>
          <h2>${esc(person.name)}</h2>
          ${tags ? `<div class="tags">${tags}</div>` : ""}
          ${person.notes ? `<p class="notes">${esc(person.notes)}</p>` : ""}
          ${renderSummary(person)}
          ${renderCadence(person)}
          <div class="tl-head">Timeline${timeline.length ? ` · ${timeline.length}` : ""}</div>
          <ul class="tl">${items}</ul>`;
      }

      // ---- archive ----
      function setArchivedView(on) {
        state.viewArchived = on;
        state.selectedId = null;
        const t = $("arch-toggle");
        t.textContent = on ? "← Active" : "Archived";
        t.classList.toggle("active-toggle", on);
        $("detail").classList.add("detail-hidden-mobile");
        $("detail").innerHTML = `<div class="empty">${on ? "Archived contacts — open one to restore it." : "Select a contact to see their timeline."}</div>`;
        loadPeople();
      }
      async function toggleArchive(pid, isArchived) {
        await api(`/api/people/${encodeURIComponent(pid)}/${isArchived ? "unarchive" : "archive"}`, {
          method: "POST",
        });
        state.selectedId = null;
        $("detail").classList.add("detail-hidden-mobile");
        $("detail").innerHTML = `<div class="empty">Select a contact to see their timeline.</div>`;
        await loadPeople();
      }

      // ---- AI summary ----
      function renderSummary(person) {
        const has = person.summary && String(person.summary).trim();
        const stale = has && person.summary_basis != null && person.summary_basis < 40; // hint only
        return `<div class="summary">
          <div class="sum-head">
            <span class="tl-head" style="margin:0">Summary</span>
            <button class="btn btn-ghost btn-sm" id="sum-btn" data-pid="${esc(person.id)}">${has ? "Refresh" : "Summarize"}</button>
          </div>
          ${
            has
              ? `<p class="sum-text">${esc(person.summary)}</p>`
              : `<p class="sum-empty">Generate a one-line read on this relationship from its timeline (Haiku).</p>`
          }
        </div>`;
      }
      async function summarize(pid, btn) {
        btn.disabled = true;
        btn.textContent = "Summarizing…";
        try {
          await api(`/api/people/${encodeURIComponent(pid)}/summarize`, { method: "POST" });
          await selectPerson(pid);
        } catch (e) {
          btn.disabled = false;
          btn.textContent = "Summarize";
          alert("Couldn't summarize: " + (e.message || "error"));
        }
      }

      // ---- cadence ----
      const CADENCE_OPTIONS = [
        { v: "", label: "Off" },
        { v: 7, label: "Weekly" },
        { v: 14, label: "Every 2 weeks" },
        { v: 30, label: "Monthly" },
        { v: 90, label: "Quarterly" },
      ];
      function cadenceOf(person) {
        const c = person.cadence;
        return (Array.isArray(c) ? c[0] : c) || null;
      }
      function cadenceStatus(cad) {
        if (!cad || !cad.next_due) return "";
        const due = new Date(cad.next_due);
        const days = Math.round((due - Date.now()) / 86400000);
        if (days < 0) return `<span class="badge overdue">overdue ${-days}d</span>`;
        if (days === 0) return `<span class="badge due">due today</span>`;
        return `<span class="cad-next">next due in ${days}d · ${esc(fmtDate(cad.next_due))}</span>`;
      }
      function renderCadence(person) {
        const cad = cadenceOf(person);
        const cur = cad ? cad.interval_days : "";
        const opts = CADENCE_OPTIONS.map(
          (o) => `<option value="${o.v}" ${String(o.v) === String(cur) ? "selected" : ""}>${o.label}</option>`,
        ).join("");
        return `<div class="cadence">
          <span class="cad-label">Keep in touch</span>
          <select id="cad-select" data-pid="${esc(person.id)}">${opts}</select>
          <span class="cad-status">${cadenceStatus(cad)}</span>
        </div>`;
      }
      async function setCadence(pid, value) {
        if (value === "") {
          await api(`/api/people/${encodeURIComponent(pid)}/cadence`, { method: "DELETE" });
        } else {
          await api(`/api/people/${encodeURIComponent(pid)}/cadence`, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ interval_days: Number(value) }),
          });
        }
        await Promise.all([selectPerson(pid), loadPeople()]); // refresh detail + list badges
      }

      // ---- add contact ----
      function openModal(open) {
        show($("modal"), open);
        if (open) { $("c-name").value = ""; $("c-tags").value = ""; $("add-msg").textContent = ""; $("c-name").focus(); }
      }
      async function addContact(e) {
        e.preventDefault();
        $("add-msg").textContent = "";
        const name = $("c-name").value.trim();
        const tags = $("c-tags").value.split(",").map((t) => t.trim()).filter(Boolean);
        if (!name) return;
        try {
          await api("/api/people", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name, tags }),
          });
          openModal(false);
          await loadPeople();
        } catch (err) {
          $("add-msg").textContent = err.message || "couldn't create";
        }
      }

      // ---- auth ----
      async function refreshAuth() {
        try {
          const { user } = await api("/api/auth/me");
          $("who-email").textContent = user?.email || user?.id || "";
          show($("auth-view"), false);
          show($("app-view"), true);
          if (new URLSearchParams(location.search).get("connected") === "google") {
            history.replaceState({}, "", location.pathname);
          }
          await Promise.all([loadPeople(), refreshConnect()]);
        } catch {
          show($("app-view"), false);
          show($("auth-view"), true);
        }
      }
      async function refreshConnect() {
        // Backend health as the connection pill; keeps the old readyz signal.
        const pill = $("connect-pill");
        try {
          const j = await api("/api/readyz");
          pill.innerHTML = `<span class="dot ok"></span> ${esc(j.backend || "backend")}`;
        } catch (e) {
          pill.innerHTML = `<span class="dot down"></span> offline`;
        }
      }

      // ---- wire up ----
      $("pw-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("signin-msg").textContent = "";
        try {
          await api("/api/auth/signin", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email: $("email").value, password: $("password").value }),
          });
          refreshAuth();
        } catch (err) {
          $("signin-msg").textContent = err.message || "sign-in failed";
        }
      });
      $("signout").addEventListener("click", async () => {
        await fetch("/api/auth/signout", { method: "POST", credentials: "same-origin" });
        state.selectedId = null;
        refreshAuth();
      });
      $("search").addEventListener("input", (e) => { state.filter = e.target.value; renderPeople(); });
      $("people").addEventListener("click", (e) => {
        const btn = e.target.closest(".person");
        if (btn) selectPerson(btn.dataset.id);
      });
      $("detail").addEventListener("click", (e) => {
        if (e.target.closest("#back-btn")) {
          state.selectedId = null;
          renderPeople();
          $("detail").classList.add("detail-hidden-mobile");
          $("detail").innerHTML = `<div class="empty">Select a contact to see their timeline.</div>`;
        }
      });
      $("detail").addEventListener("click", (e) => {
        const b = e.target.closest("#sum-btn");
        if (b) { summarize(b.dataset.pid, b); return; }
        const a = e.target.closest("#arch-btn");
        if (a) {
          a.disabled = true;
          toggleArchive(a.dataset.pid, a.dataset.archived === "1").catch((err) => {
            a.disabled = false;
            alert("Couldn't update: " + (err.message || "error"));
          });
        }
      });
      $("arch-toggle").addEventListener("click", () => setArchivedView(!state.viewArchived));
      $("detail").addEventListener("change", (e) => {
        const sel = e.target.closest("#cad-select");
        if (sel) {
          sel.disabled = true;
          setCadence(sel.dataset.pid, sel.value).catch((err) => {
            sel.disabled = false;
            alert("Couldn't update cadence: " + (err.message || "error"));
          });
        }
      });
      $("add-btn").addEventListener("click", () => openModal(true));
      $("add-cancel").addEventListener("click", () => openModal(false));
      $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) openModal(false); });
      $("add-form").addEventListener("submit", addContact);

      refreshAuth();
    </script>
  </body>
</html>
